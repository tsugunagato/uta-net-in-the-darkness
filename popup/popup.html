<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Uta-Net in the Darkness</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Uta-Net in the Darkness</h1>
  </header>

  <section>
    <label class="row">
      <span class="label">
        ダークモード
        <small class="shortcut" data-command="toggle-dark"></small>
      </span>
      <input type="checkbox" class="switch" id="enabled">
    </label>
    <label class="row">
      <span class="label">画像を少し暗くする</span>
      <input type="checkbox" class="switch" id="dimImages">
    </label>
  </section>

  <section>
    <div class="row column">
      <span class="label">
        歌詞の段組み
        <small class="shortcut" data-command="cycle-columns" data-suffix=" で切り替え"></small>
      </span>
      <div class="segmented" role="radiogroup" aria-label="歌詞の段組み">
        <label><input type="radio" name="lyricsColumns" value="off"><span>オフ</span></label>
        <label><input type="radio" name="lyricsColumns" value="auto"><span>自動</span></label>
        <label><input type="radio" name="lyricsColumns" value="2"><span>2列</span></label>
        <label><input type="radio" name="lyricsColumns" value="3"><span>3列</span></label>
      </div>
      <p class="hint">「自動」は画面の高さに収まるよう 1〜3 列から選びます。幅 768px 未満では段組みしません。</p>
    </div>
  </section>

  <footer>非公式の拡張機能です。歌ネットとは無関係です。</footer>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
