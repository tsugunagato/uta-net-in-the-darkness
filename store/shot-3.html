<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>screenshot 3</title>
<link rel="stylesheet" href="shot.css">
<style>
  .settings { position: absolute; left: 64px; top: 216px; width: 560px; margin: 0; border-collapse: collapse; font-size: 16px; }
  .settings th, .settings td { padding: 16px 0; border-bottom: 1px solid var(--hairline); text-align: left; vertical-align: top; }
  .settings th { width: 168px; font-weight: 500; }
  .settings td { color: var(--text-2); }
  .settings td.key { width: 132px; text-align: right; }
  kbd { padding: 2px 6px; border: 1px solid var(--hairline); border-radius: 4px; background: var(--raised); font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--text); }
  .note { position: absolute; left: 64px; top: 400px; width: 560px; margin: 0; font-size: 15px; line-height: 1.7; color: var(--text-2); }
  .popup { position: absolute; right: 120px; top: 136px; width: 300px; height: 340px; transform: scale(1.6); transform-origin: top right;
           border-radius: 10px; overflow: hidden; border: 1px solid var(--hairline); }
  .popup iframe { width: 300px; height: 340px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="caption">
    <h1>設定はツールバーのボタンから</h1>
    <p>キーボードでも切り替えられます</p>
  </div>
  <table class="settings">
    <tr><th>ダークモード</th><td>オン / オフ</td><td class="key"><kbd>Alt+Shift+D</kbd></td></tr>
    <tr><th>歌詞の段組み</th><td>オフ・自動・2列・3列</td><td class="key"><kbd>Alt+Shift+L</kbd></td></tr>
    <tr><th>画像を少し暗く</th><td>初期状態はオフ</td><td class="key"></td></tr>
  </table>
  <p class="note">閲覧履歴などのデータは集めません。uta-net.com 以外のサイトでは動きません</p>
  <div class="popup"><iframe src="popup-preview.html"></iframe></div>
</body>
</html>
