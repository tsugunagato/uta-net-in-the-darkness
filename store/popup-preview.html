<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>popup preview</title>
<!-- ストア用画像向けに、実際のポップアップの CSS で設定画面を表示する（popup.js は読まない） -->
<link rel="stylesheet" href="../popup/popup.css">
</head>
<body>
  <header><h1>Uta-Net in the Darkness</h1></header>
  <section>
    <label class="row"><span class="label">ダークモード<small>Alt+Shift+D</small></span><input type="checkbox" class="switch" checked></label>
    <label class="row"><span class="label">画像を少し暗くする</span><input type="checkbox" class="switch"></label>
  </section>
  <section>
    <div class="row column">
      <span class="label">歌詞の段組み<small>Alt+Shift+L で切り替え</small></span>
      <div class="segmented">
        <label><input type="radio" name="c"><span>オフ</span></label>
        <label><input type="radio" name="c" checked><span>自動</span></label>
        <label><input type="radio" name="c"><span>2列</span></label>
        <label><input type="radio" name="c"><span>3列</span></label>
      </div>
      <p class="hint">「自動」は画面の高さに収まるよう 1〜3 列から選びます。幅 768px 未満では段組みしません。</p>
    </div>
  </section>
  <footer>非公式の拡張機能です。歌ネットとは無関係です。</footer>
</body>
</html>
